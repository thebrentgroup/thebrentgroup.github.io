name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Since October 2026 the site is the set of finished pages in
      # static-site/. Nothing is generated. The files the pages link to
      # (curricula vitae, demonstration PDFs, icons, the 404 page) are taken
      # from public/, and the pages in static-site/ are copied over them.
      # The earlier React source remains in the repository, unused by this
      # workflow, and could be built again with npm ci and npm run build.
      - run: |
          mkdir _site
          cp -R public/. _site/
          cp -R static-site/. _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
